<mat-card class="verified-card">
  <div class="success-icon" aria-hidden="true">✓</div>
  <mat-card-title>New email verified</mat-card-title>
  <mat-card-content>
    <p>
      Your new email address has been verified. You can sign in and continue using your account.
    </p>
  </mat-card-content>
  <mat-card-actions class="actions-row">
    <button mat-raised-button color="primary" type="button" (click)="goToSignIn()">
      Sign in
    </button>
  </mat-card-actions>
</mat-card>
