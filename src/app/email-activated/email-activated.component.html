<mat-card class="activated-card">
  <div class="success-icon" aria-hidden="true">✓</div>
  <mat-card-title>Account activated</mat-card-title>
  <mat-card-content>
    <p>
      Your email address has been verified and your account is activated. You can
      sign in with your email and password.
    </p>
  </mat-card-content>
  <mat-card-actions class="actions-row">
    <button mat-raised-button color="primary" type="button" (click)="goToSignIn()">
      Sign in
    </button>
  </mat-card-actions>
</mat-card>
