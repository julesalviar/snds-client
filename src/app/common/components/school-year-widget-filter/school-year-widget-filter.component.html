<div
  class="school-year-widget-filter-toolbar"
  [class.school-year-widget-filter-toolbar--align-start]="!alignEnd">
  <label class="p-select-sm-label" [attr.for]="resolvedControlId">School Year</label>
  <select
    [id]="resolvedControlId"
    class="p-select-sm"
    [ngModel]="selectedYear"
    (ngModelChange)="onModelChange($event)"
    [disabled]="disabled">
    @for (sy of options; track sy) {
      <option [value]="sy">{{ sy }}</option>
    }
  </select>
</div>
