<mat-card>
  <mat-card-title>Offices</mat-card-title>

  <div class="top-actions">
    <button mat-raised-button color="primary" (click)="onCreate()">
      <mat-icon>add</mat-icon>
      Create Office
    </button>
  </div>

  <div class="table-wrapper">
    <div class="filter-container">
      <div class="filter-fields">
        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>Search</mat-label>
          <input
            matInput
            [(ngModel)]="searchTerm"
            (ngModelChange)="onSearchInput()"
            placeholder="Name, division...">
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>Division</mat-label>
          <mat-select
            [(ngModel)]="filterDivision"
            (selectionChange)="onDivisionChange()">
            <mat-option value="">All</mat-option>
            <mat-option *ngFor="let div of divisionOptions" [value]="div">{{ div }}</mat-option>
          </mat-select>
        </mat-form-field>

        <button *ngIf="hasActiveFilters" mat-button color="warn" (click)="clearFilters()" class="clear-button">
          Clear Filters
        </button>
      </div>
    </div>

    <div *ngIf="isLoading" class="skeleton-table-wrapper" aria-hidden="true">
      <div class="skeleton-table">
        <div class="skeleton-table-header">
          <div class="skeleton skeleton-table-cell" style="width: 35%"></div>
          <div class="skeleton skeleton-table-cell" style="width: 45%"></div>
          <div class="skeleton skeleton-table-cell" style="width: 20%"></div>
        </div>
        <div class="skeleton-table-row" *ngFor="let _ of [1,2,3,4,5,6,7]">
          <div class="skeleton skeleton-table-cell" style="width: 35%"></div>
          <div class="skeleton skeleton-table-cell" style="width: 45%"></div>
          <div class="skeleton skeleton-table-cell" style="width: 20%"></div>
        </div>
      </div>
    </div>

    <div *ngIf="!isLoading && totalItems === 0" class="empty-state">
      <p class="empty-state-title">No offices found</p>
      <p class="empty-state-message">
        Create an office using the button above, or adjust your filters.
      </p>
    </div>

    <div *ngIf="!isLoading && totalItems > 0" class="table-scroll">
      <table mat-table [dataSource]="dataSource" class="office-table mat-elevation-z2">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let row"><div class="cell-content" [matTooltip]="row.name ?? '—'">{{ row.name ?? '—' }}</div></td>
        </ng-container>
        <ng-container matColumnDef="division">
          <th mat-header-cell *matHeaderCellDef>Division</th>
          <td mat-cell *matCellDef="let row"><div class="cell-content" [matTooltip]="row.division ?? '—'">{{ row.division ?? '—' }}</div></td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let row" class="actions-cell">
            <button mat-icon-button
                    class="action-edit"
                    type="button"
                    matTooltip="Edit"
                    aria-label="Edit office"
                    (click)="onEdit(row)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button
                    class="action-delete"
                    type="button"
                    matTooltip="Delete"
                    aria-label="Delete office"
                    (click)="onDelete(row)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>

    <mat-paginator
      *ngIf="!isLoading && totalItems > 0"
      [length]="totalItems"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      [pageSizeOptions]="pageSizeOptions"
      showFirstLastButtons
      (page)="onPageChange($event)">
    </mat-paginator>
  </div>
</mat-card>
