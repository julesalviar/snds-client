<h2 mat-dialog-title>Manage tags</h2>
<mat-dialog-content>
  <p class="user-label">{{ displayName }}</p>
  <div *ngIf="isLoadingOptions" class="loading-options">
    <mat-spinner diameter="24"></mat-spinner>
    <span>Loading tags…</span>
  </div>
  <mat-form-field *ngIf="!isLoadingOptions" appearance="outline" class="full-width">
    <mat-label>Tags</mat-label>
    <mat-select [(ngModel)]="selectedTags" multiple>
      <mat-option *ngFor="let opt of tagOptions" [value]="opt.key">
        {{ opt.label }}
      </mat-option>
    </mat-select>
    <mat-hint *ngIf="tagOptions.length === 0">No tags configured in reference data.</mat-hint>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()" [disabled]="isSubmitting">
    Cancel
  </button>
  <button
    mat-raised-button
    color="primary"
    type="button"
    (click)="onSave()"
    [disabled]="isSubmitting || isLoadingOptions">
    <span *ngIf="!isSubmitting">Save</span>
    <span *ngIf="isSubmitting" class="submitting">
      <mat-spinner diameter="20" class="inline-spinner"></mat-spinner>
      Saving…
    </span>
  </button>
</mat-dialog-actions>
